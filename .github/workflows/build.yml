name: Build The Collectives APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # This sets up the Android SDK and accepts all licenses automatically
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Explicitly install the exact platform and build tools needed for compileSdk = 34
      - name: Install SDK Platform 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Setup Gradle Engine
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Collectives-App
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
