name: Build The Collectives APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # CRITICAL: Accept licenses BEFORE installing anything
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      # Install the exact platform and build tools needed
      - name: Install SDK Platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # Disable cache to avoid those "Failed to restore" errors cluttering the log
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      # Build with --stacktrace to show the exact error if it still fails
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Collectives-App
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
