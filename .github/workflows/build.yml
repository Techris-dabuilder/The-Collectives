name: Build The Collectives APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:        # lets you hit "Run workflow" manually from the Actions tab

jobs:
  build:
    name: Compile Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"   # pins exact version — no stale system Gradle, no wrapper needed

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        # --no-daemon: CI runners are ephemeral, daemon gains nothing
        # --stacktrace: if it fails, you get an actual readable error, not a one-liner

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Collectives-App
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
